<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Hypervision — A&R</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#faf9f7;
  --border:#e8e6e0;--border2:#d8d5ce;
  --text:#1c1b18;--text2:#6e6b63;--text3:#a8a49c;
  --accent:#1c1b18;--green:#1a6640;--green-bg:#edf7f2;--green-border:#b6dfc8;
  --amber:#7c4a00;--amber-bg:#fef6e4;--amber-border:#f5d48a;
  --red:#8b1a1a;--red-bg:#fef2f2;--red-border:#fbc9c9;
  --blue:#1a3a8b;--blue-bg:#eff4ff;
  --r:10px;--r-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:15px}
.layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1.5rem 0}
.sidebar-logo{padding:0 1.25rem 1.5rem;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.nav-section{padding:0 .75rem;margin-bottom:.25rem}
.nav-label{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);padding:.5rem .5rem .35rem}
.nav-item{display:flex;align-items:center;gap:8px;padding:.5rem .75rem;border-radius:var(--r-sm);font-size:14px;color:var(--text2);cursor:pointer;transition:background .12s,color .12s;border:none;background:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--text);color:#fff}
.nav-item .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5;flex-shrink:0}
.nav-item.active .dot{opacity:1;background:#fff}
.nav-item .soon{font-size:10px;opacity:.5;margin-left:auto}
.main{flex:1;overflow-y:auto;padding:2rem 2.5rem}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;gap:12px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:300;letter-spacing:-.02em}
.page-title strong{font-weight:500}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-sm);padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;border:none;transition:opacity .15s,background .15s;white-space:nowrap}
.btn-primary{background:var(--text);color:#fff}
.btn-primary:hover{opacity:.82}
.btn-primary:disabled{opacity:.3;cursor:not-allowed}
.btn-secondary{background:none;color:var(--text);border:1px solid var(--border2)}
.btn-secondary:hover{background:var(--bg)}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-ghost{background:none;border:none;color:var(--text2);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;padding:4px 8px;border-radius:var(--r-sm);display:inline-flex;align-items:center;gap:5px}
.btn-ghost:hover{background:var(--bg);color:var(--text)}
.gmail-bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.85rem 1.25rem;margin-bottom:1.5rem}
.gmail-dot{width:8px;height:8px;border-radius:50%;background:var(--border2);flex-shrink:0;transition:background .3s}
.gmail-dot.on{background:var(--green)}
.meeting-block{margin-bottom:2rem}
.meeting-header{display:flex;align-items:center;gap:12px;margin-bottom:1rem}
.meeting-date-badge{font-size:12px;font-weight:500;padding:4px 12px;border-radius:20px;background:var(--text);color:#fff}
.meeting-date-badge.past{background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.meeting-divider{flex:1;height:1px;background:var(--border)}
.meeting-toggle{font-size:12px;color:var(--text3);cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;padding:0}
.meeting-toggle:hover{color:var(--text2)}
.song-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.75rem;overflow:hidden;transition:box-shadow .15s}
.song-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.06)}
.song-card-header{display:flex;align-items:center;gap:12px;padding:1rem 1.25rem;cursor:pointer}
.song-num{font-size:12px;font-weight:500;font-family:'DM Mono',monospace;color:var(--text3);width:20px;flex-shrink:0}
.song-title-wrap{flex:1;min-width:0}
.song-title{font-size:15px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-writers{font-size:12px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-badges{display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;font-weight:500}
.badge-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.badge-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.badge-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.badge-blue{background:var(--blue-bg);color:var(--blue)}
.badge-dark{background:var(--text);color:#fff}
.badge-neutral{background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.song-body{padding:0 1.25rem 1.25rem;border-top:1px solid var(--border);display:none}
.song-body.open{display:block}
.field-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:1rem}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:140px}
.field label{font-size:12px;color:var(--text2);font-weight:400}
.field input,.field textarea,.field select{font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;outline:none;resize:none;width:100%;transition:border-color .15s}
.field input:focus,.field textarea:focus{border-color:var(--text)}
.helper{font-size:11px;color:var(--text3);margin-top:3px}
.disco-row{display:flex;gap:7px}
.disco-row input{flex:1}
.tag-wrap{display:flex;flex-wrap:wrap;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 10px;min-height:40px;cursor:text;transition:border-color .15s}
.tag-wrap:focus-within{border-color:var(--text)}
.tag-wrap input{border:none;background:none;outline:none;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;min-width:120px;flex:1;padding:0}
.tag{font-size:12px;padding:2px 9px;border-radius:20px;background:var(--text);color:#fff;display:flex;align-items:center;gap:4px}
.tag button{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.6);font-size:13px;padding:0;line-height:1;display:flex}
.tag button:hover{color:#fff}
.pitches-section{margin-top:1rem}
.pitch-row{display:flex;align-items:center;gap:10px;padding:.6rem .85rem;border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:.4rem;font-size:13px;flex-wrap:wrap;gap:8px}
.pitch-row.approved{border-color:var(--green-border);background:var(--green-bg)}
.pitch-row.skipped{opacity:.35}
.pitch-artist{font-weight:500;flex:1;min-width:100px}
.pitch-contact{color:var(--text2);font-size:12px;flex:1;min-width:100px}
.pitch-actions{display:flex;gap:5px;flex-shrink:0}
.draft-modal{position:fixed;inset:0;background:rgba(28,27,24,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.draft-inner{background:var(--surface);border-radius:var(--r);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.draft-top{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid var(--border)}
.draft-content{padding:1.5rem}
.edit-area{width:100%;font-size:13px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;font-family:'DM Mono',monospace;resize:vertical;outline:none;line-height:1.75;min-height:200px}
.edit-area:focus{border-color:var(--text)}
.subject-inp{width:100%;font-size:13px;font-weight:500;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 10px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:8px}
.spinner{width:13px;height:13px;border:2px solid var(--border2);border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text2)}
.alert{font-size:13px;padding:.75rem 1rem;border-radius:var(--r-sm);display:flex;gap:8px;margin-bottom:.75rem;line-height:1.5}
.alert-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.alert-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text3)}
.empty-state p{font-size:14px;margin-top:.5rem}
.add-song-form{background:var(--surface);border:1px dashed var(--border2);border-radius:var(--r);padding:1.25rem;margin-bottom:.75rem}
.coming-soon{padding:4rem 2rem;text-align:center;color:var(--text3)}
.coming-soon h2{font-size:18px;font-weight:400;margin-bottom:.5rem;color:var(--text2)}
.log-row{display:flex;gap:10px;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap}
.log-row:last-child{border-bottom:none}
</style>
</head>
<body>
<div class="layout">

<aside class="sidebar">
  <div class="sidebar-logo">Hypervision</div>
  <div class="nav-section">
    <div class="nav-label">A&R Meeting</div>
    <button class="nav-item" onclick="showTab('pipeline')">
      <span class="dot"></span> Pipeline <span class="soon">soon</span>
    </button>
    <button class="nav-item" onclick="showTab('clients')">
      <span class="dot"></span> Existing clients <span class="soon">soon</span>
    </button>
    <button class="nav-item active" id="nav-songs" onclick="showTab('songs')">
      <span class="dot"></span> Songs
    </button>
  </div>
  <div style="flex:1"></div>
  <div style="padding:1rem 1.25rem;border-top:1px solid var(--border)">
    <div style="font-size:12px;color:var(--text3);margin-bottom:.4rem">Sender</div>
    <select id="sender-name" onchange="saveConfig()" style="font-family:'DM Sans',sans-serif;font-size:13px;width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 8px;color:var(--text);outline:none">
      <option>Chris</option><option>Max</option><option>Ralph</option>
    </select>
  </div>
</aside>

<main class="main" id="main-content">

  <div id="tab-songs">
    <div class="topbar">
      <div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:3px" id="today-label"></div>
        <h1 class="page-title">A&R <strong>Songs</strong></h1>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <div class="gmail-bar" style="margin:0;padding:.6rem 1rem">
          <div class="gmail-dot" id="gmail-dot"></div>
          <span style="font-size:13px;color:var(--text2)" id="gmail-status-short">Gmail</span>
          <button class="btn-ghost btn-sm" onclick="connectGmail()" id="gmail-btn" style="margin-left:6px">Connect</button>
        </div>
        <div class="field" style="min-width:0;flex:0">
          <input type="password" id="at-token" placeholder="Airtable token…" oninput="saveConfig()" style="font-size:13px;padding:7px 10px;width:180px" />
        </div>
        <button class="btn btn-primary" onclick="startNewMeeting()">+ New meeting</button>
      </div>
    </div>
    <div id="meetings-container"></div>
  </div>

  <div id="tab-pipeline" style="display:none">
    <div class="topbar"><h1 class="page-title">A&R <strong>Pipeline</strong></h1></div>
    <div class="coming-soon"><h2>Coming soon</h2><p>Track potential new signings and follow-ups here.</p></div>
  </div>

  <div id="tab-clients" style="display:none">
    <div class="topbar"><h1 class="page-title"><strong>Existing</strong> Clients</h1></div>
    <div class="coming-soon"><h2>Coming soon</h2><p>Weekly updates per artist — deals, releases, next steps.</p></div>
  </div>

</main>
</div>

<div class="draft-modal" id="draft-modal" style="display:none" onclick="closeDraftModal(event)">
  <div class="draft-inner" onclick="event.stopPropagation()">
    <div class="draft-top">
      <div>
        <div style="font-size:13px;color:var(--text2)">Draft to: <strong id="modal-to" style="color:var(--text)"></strong></div>
        <div style="font-size:12px;color:var(--text3);margin-top:2px">CC: music@hypervision.club</div>
      </div>
      <button class="btn-ghost" onclick="closeDraftModal()">✕ Close</button>
    </div>
    <div class="draft-content">
      <div id="modal-alerts"></div>
      <div id="modal-contact-choice" style="display:none;margin-bottom:1rem"></div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:4px">Subject</div>
      <input type="text" class="subject-inp" id="modal-subject" />
      <div style="font-size:12px;color:var(--text2);margin-bottom:5px">Email</div>
      <textarea class="edit-area" id="modal-body" rows="11"></textarea>
      <div id="modal-email-row" style="display:none;margin-top:8px">
        <input type="email" id="modal-manual-email" placeholder="Contact email not found — enter manually…" style="width:100%;font-size:13px;padding:7px 10px;border-radius:var(--r-sm);border:1px solid var(--amber-border);background:var(--amber-bg);color:var(--text);font-family:'DM Sans',sans-serif;outline:none"/>
      </div>
      <div style="display:flex;gap:8px;margin-top:1.25rem;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="approveDraft()">✓ Approve & save to Gmail</button>
        <button class="btn btn-secondary" onclick="closeDraftModal()">Close</button>
        <div id="modal-status" style="display:flex;align-items:center;font-size:13px;color:var(--text2)"></div>
      </div>
    </div>
  </div>
</div>

<script>
const BASE_ID='appgFxNIXKQlHHms8';
const CLIENT_ID='888678513782-mpcldrih4ikqslvii6p2j54atu63p5t1.apps.googleusercontent.com';
const REDIRECT=location.href.split('?')[0].split('#')[0];
const SCOPES='https://www.googleapis.com/auth/gmail.compose https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/userinfo.profile';

let gmailToken=null;
let gmailUser=null;
let meetings=[];
let currentDraft=null;

function saveConfig(){
  try{
    localStorage.setItem('hv_at',document.getElementById('at-token').value);
    localStorage.setItem('hv_sender',document.getElementById('sender-name').value);
  }catch(e){}
}
function loadConfig(){
  try{
    const t=localStorage.getItem('hv_at');
    const s=localStorage.getItem('hv_sender');
    if(t)document.getElementById('at-token').value=t;
    if(s)document.getElementById('sender-name').value=s;
  }catch(e){}
}
function saveMeetings(){
  try{localStorage.setItem('hv_meetings',JSON.stringify(meetings));}catch(e){}
}
function loadMeetings(){
  try{
    const m=localStorage.getItem('hv_meetings');
    if(m)meetings=JSON.parse(m);
  }catch(e){}
}

(function(){
  const hash=location.hash;
  if(hash&&hash.includes('access_token')){
    const params=new URLSearchParams(hash.substring(1));
    const token=params.get('access_token');
    if(token){gmailToken=token;history.replaceState(null,'',location.pathname);fetchGmailUser();}
  }
})();

function connectGmail(){
  const url=`https://accounts.google.com/o/oauth2/v2/auth?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT)}&response_type=token&scope=${encodeURIComponent(SCOPES)}&prompt=select_account`;
  location.href=url;
}
async function fetchGmailUser(){
  try{
    const res=await fetch('https://www.googleapis.com/oauth2/v1/userinfo',{headers:{Authorization:`Bearer ${gmailToken}`}});
    const u=await res.json();
    gmailUser=u;
    const firstName=u.given_name||u.name?.split(' ')[0]||'You';
    document.getElementById('gmail-status-short').textContent=firstName;
    document.getElementById('gmail-btn').style.display='none';
    document.getElementById('gmail-dot').classList.add('on');
    document.getElementById('sender-name').value=firstName;
    saveConfig();
  }catch(e){}
}

function showTab(t){
  ['songs','pipeline','clients'].forEach(id=>{
    document.getElementById(`tab-${id}`).style.display=id===t?'block':'none';
    document.getElementById(`nav-${id}`)?.classList.toggle('active',id===t);
  });
}
document.querySelectorAll('.nav-item').forEach(el=>{
  el.id=el.id||('nav-'+el.textContent.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z-]/g,''));
});

function formatDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function todayISO(){return new Date().toISOString().split('T')[0];}

function startNewMeeting(){
  const today=todayISO();
  const existing=meetings.find(m=>m.date===today);
  if(existing){
    if(!confirm('There is already a meeting for today. Start a new one anyway?'))return;
  }
  const meeting={id:Date.now(),date:today,songs:[],open:true};
  meetings.unshift(meeting);
  saveMeetings();
  renderMeetings();
}

function renderMeetings(){
  const con=document.getElementById('meetings-container');
  if(!meetings.length){
    con.innerHTML=`<div class="empty-state"><div style="font-size:32px">🎵</div><p>No meetings yet — click <strong>New meeting</strong> to start today's A&R session.</p></div>`;
    return;
  }
  con.innerHTML='';
  meetings.forEach((m,mi)=>{
    const isToday=m.date===todayISO();
    const block=document.createElement('div');
    block.className='meeting-block';
    block.innerHTML=`
      <div class="meeting-header">
        <span class="meeting-date-badge${isToday?'':' past'}">${isToday?'Today — ':''}${formatDate(m.date)}</span>
        <div class="meeting-divider"></div>
        <button class="meeting-toggle" onclick="toggleMeeting(${mi})">${m.open?'Collapse ▴':'Expand ▾'}</button>
      </div>
      <div id="meeting-body-${mi}" style="display:${m.open?'block':'none'}">
        <div id="songs-list-${mi}"></div>
        ${isToday||m.open?`<div class="add-song-form" id="add-form-${mi}">
          <div style="font-size:13px;font-weight:500;margin-bottom:.85rem;color:var(--text2)">Add a song</div>
          <div style="display:flex;gap:7px;margin-bottom:10px">
            <input type="text" id="disco-${mi}" placeholder="Paste DISCO link…" style="flex:1;font-size:13px;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);outline:none;font-family:'DM Sans',sans-serif;color:var(--text)" />
            <button class="btn btn-secondary btn-sm" onclick="fetchDisco(${mi})">Auto-fill</button>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
            <div style="flex:1;min-width:120px">
              <input type="text" id="title-${mi}" placeholder="Track title" style="width:100%;font-size:13px;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);outline:none;font-family:'DM Sans',sans-serif;color:var(--text)" />
            </div>
            <div style="flex:1;min-width:120px">
              <input type="text" id="writers-${mi}" placeholder="Writers" style="width:100%;font-size:13px;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);outline:none;font-family:'DM Sans',sans-serif;color:var(--text)" />
            </div>
          </div>
          <textarea id="vibe-${mi}" placeholder="One punchy sentence — e.g. super catchy disco-influenced topline, warm and summery" rows="2" style="width:100%;font-size:13px;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);outline:none;resize:none;font-family:'DM Sans',sans-serif;color:var(--text);margin-bottom:10px"></textarea>
          <button class="btn btn-primary btn-sm" onclick="addSong(${mi})">Add song</button>
          <div id="add-status-${mi}" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);margin-left:10px"></div>
        </div>`:''}
      </div>`;
    con.appendChild(block);
    renderSongs(mi);
  });
}

function toggleMeeting(mi){
  meetings[mi].open=!meetings[mi].open;
  saveMeetings();
  renderMeetings();
}

async function fetchDisco(mi){
  const url=document.getElementById(`disco-${mi}`).value.trim();
  if(!url){alert('Paste a DISCO link first');return;}
  const btn=event.target;
  btn.disabled=true;btn.textContent='…';
  try{
    const res=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
    const data=await res.json();
    const html=data.contents||'';
    const ogTitle=html.match(/og:title[^>]*content="([^"]+)"/i)||html.match(/content="([^"]+)"[^>]*og:title/i);
    const twitterTitle=html.match(/twitter:title[^>]*content="([^"]+)"/i)||html.match(/content="([^"]+)"[^>]*twitter:title/i);
    const raw=(ogTitle||twitterTitle)?.[1]||'';
    if(raw){
      const cleaned=raw.replace(/^Hypervision\s*[-–]\s*/i,'').trim();
      const byIdx=cleaned.indexOf(' by ');
      if(byIdx>-1){
        document.getElementById(`title-${mi}`).value=cleaned.substring(0,byIdx).trim();
        document.getElementById(`writers-${mi}`).value=cleaned.substring(byIdx+4).trim();
      } else {
        document.getElementById(`title-${mi}`).value=cleaned;
      }
    } else {alert('Could not auto-fill — fill in manually.');}
  }catch(e){alert('Could not auto-fill — fill in manually.');}
  btn.disabled=false;btn.textContent='Auto-fill';
}

function addSong(mi){
  const title=document.getElementById(`title-${mi}`).value.trim();
  if(!title){alert('Fill in the track title first');return;}
  const song={
    id:Date.now(),
    disco:document.getElementById(`disco-${mi}`).value.trim(),
    title,
    writers:document.getElementById(`writers-${mi}`).value.trim(),
    vibe:document.getElementById(`vibe-${mi}`).value.trim(),
    targets:[],
    pitches:[],
    open:true
  };
  meetings[mi].songs.push(song);
  saveMeetings();
  document.getElementById(`disco-${mi}`).value='';
  document.getElementById(`title-${mi}`).value='';
  document.getElementById(`writers-${mi}`).value='';
  document.getElementById(`vibe-${mi}`).value='';
  renderSongs(mi);
}

function renderSongs(mi){
  const con=document.getElementById(`songs-list-${mi}`);
  if(!con)return;
  const songs=meetings[mi].songs;
  if(!songs.length){con.innerHTML='';return;}
  con.innerHTML='';
  songs.forEach((song,si)=>{
    const pitchCount=song.pitches.length;
    const approvedCount=song.pitches.filter(p=>p.approved).length;
    const card=document.createElement('div');
    card.className='song-card';
    card.innerHTML=`
      <div class="song-card-header" onclick="toggleSong(${mi},${si})">
        <div class="song-num">${String(si+1).padStart(2,'0')}</div>
        <div class="song-title-wrap">
          <div class="song-title">${song.title}</div>
          <div class="song-writers">${song.writers||'—'}</div>
        </div>
        <div class="song-badges">
          ${song.vibe?`<span class="badge badge-neutral" style="max-width:180px;overflow:hidden;text-overflow:ellipsis">${song.vibe.substring(0,30)}${song.vibe.length>30?'…':''}</span>`:''}
          ${approvedCount?`<span class="badge badge-green">${approvedCount} sent</span>`:''}
          ${pitchCount-approvedCount>0?`<span class="badge badge-amber">${pitchCount-approvedCount} pending</span>`:''}
        </div>
        <div style="color:var(--text3);font-size:13px;margin-left:4px">${song.open?'▴':'▾'}</div>
      </div>
      <div class="song-body${song.open?' open':''}" id="song-body-${mi}-${si}">
        <div class="field-row">
          <div class="field" style="max-width:340px">
            <label>DISCO link</label>
            <input type="text" value="${song.disco||''}" onchange="updateSong(${mi},${si},'disco',this.value)" placeholder="https://s.disco.ac/…"/>
          </div>
          <div class="field">
            <label>Vibe</label>
            <input type="text" value="${song.vibe||''}" onchange="updateSong(${mi},${si},'vibe',this.value)" placeholder="One punchy sentence…"/>
          </div>
        </div>
        <div style="margin-top:1rem">
          <div style="font-size:12px;color:var(--text2);margin-bottom:.5rem;font-weight:500">Pitch targets — type artist name, press Enter</div>
          <div class="tag-wrap" id="target-wrap-${mi}-${si}" onclick="document.getElementById('target-input-${mi}-${si}').focus()">
            ${song.targets.map((t,ti)=>`<div class="tag">${t}<button onclick="removeTarget(${mi},${si},${ti});event.stopPropagation()">×</button></div>`).join('')}
            <input type="text" id="target-input-${mi}-${si}" placeholder="e.g. Justin Bieber…" onkeydown="handleTargetInput(event,${mi},${si})"/>
          </div>
          <div style="font-size:11px;color:var(--text3);margin-top:3px">We'll find their management in Airtable, Gmail history, or online</div>
        </div>
        ${song.targets.length?`
        <div class="pitches-section">
          <div style="font-size:12px;color:var(--text2);margin-bottom:.5rem;font-weight:500">Drafts</div>
          ${song.targets.map((target,ti)=>{
            const pitch=song.pitches.find(p=>p.target===target);
            return `<div class="pitch-row${pitch?.approved?' approved':''}${pitch?.skipped?' skipped':''}">
              <div class="pitch-artist">${target}</div>
              <div class="pitch-contact">${pitch?.contactName?pitch.contactName+(pitch.email?` &lt;${pitch.email}&gt;`:''):'—'}</div>
              <div class="pitch-actions">
                ${pitch?.approved
                  ?`<span class="badge badge-green">✓ Sent to drafts</span>`
                  :`<button class="btn btn-primary btn-sm" onclick="openDraft(${mi},${si},'${target.replace(/'/g,"\\'")}')">Draft email</button>`
                }
              </div>
            </div>`;
          }).join('')}
        </div>`:''}
        ${song.disco?`<div style="margin-top:.85rem"><a href="${song.disco}" target="_blank" style="font-size:12px;color:var(--blue);text-decoration:none">↗ Open in DISCO</a></div>`:''}
      </div>`;
    con.appendChild(card);
  });
}

function toggleSong(mi,si){
  meetings[mi].songs[si].open=!meetings[mi].songs[si].open;
  saveMeetings();
  renderSongs(mi);
}
function updateSong(mi,si,field,val){
  meetings[mi].songs[si][field]=val;
  saveMeetings();
}
function handleTargetInput(e,mi,si){
  if(e.key==='Enter'||e.key===','){
    e.preventDefault();
    const val=e.target.value.trim().replace(/,$/,'');
    if(val&&!meetings[mi].songs[si].targets.includes(val)){
      meetings[mi].songs[si].targets.push(val);
      saveMeetings();
      renderSongs(mi);
    }
    e.target.value='';
  }
}
function removeTarget(mi,si,ti){
  meetings[mi].songs[si].targets.splice(ti,1);
  meetings[mi].songs[si].pitches=meetings[mi].songs[si].pitches.filter(p=>p.target!==meetings[mi].songs[si].targets[ti]);
  saveMeetings();
  renderSongs(mi);
}

async function atFetch(path){
  const token=document.getElementById('at-token').value.trim();
  if(!token)return null;
  try{
    const res=await fetch(`https://api.airtable.com/v0/${BASE_ID}${path}`,{headers:{Authorization:`Bearer ${token}`}});
    return await res.json();
  }catch(e){return null;}
}

async function lookupArtist(name){
  const formula=encodeURIComponent(`SEARCH(LOWER("${name.toLowerCase()}"),LOWER({Name}))`);
  const data=await atFetch(`/Talents?filterByFormula=${formula}&maxRecords=1`);
  if(!data?.records?.length)return null;
  const rec=data.records[0];
  const talentId=rec.id;
  const talentName=rec.fields['Name']||name;
  const teamsFormula=encodeURIComponent(`FIND("${talentId}",ARRAYJOIN({Management (Roster)}))`);
  const teamsData=await atFetch(`/Teams?filterByFormula=${teamsFormula}&maxRecords=10`);
  const contacts=(teamsData?.records||[]).map(r=>({id:r.id,name:r.fields['Name']||'Unknown',email:r.fields['Email']||null,tags:r.fields['Tags']||''}));
  return{type:'artist',talentName,contacts};
}

async function lookupCompany(name){
  const formula=encodeURIComponent(`SEARCH(LOWER("${name.toLowerCase()}"),LOWER({Name}))`);
  const data=await atFetch(`/Companies?filterByFormula=${formula}&maxRecords=1`);
  if(!data?.records?.length)return null;
  const rec=data.records[0];
  const f=rec.fields;
  return{type:'company',companyName:f['Name']||name,email:f['Email']||null,contactName:f['Contact name']||null};
}

async function checkGmailHistory(name){
  if(!gmailToken)return null;
  try{
    const q=encodeURIComponent(`"${name}" in:sent`);
    const res=await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${q}&maxResults=3`,{headers:{Authorization:`Bearer ${gmailToken}`}});
    const data=await res.json();
    if(!data.messages?.length)return null;
    const msgRes=await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${data.messages[0].id}?format=metadata&metadataHeaders=To`,{headers:{Authorization:`Bearer ${gmailToken}`}});
    const msg=await msgRes.json();
    const toHeader=msg.payload?.headers?.find(h=>h.name==='To');
    if(!toHeader)return null;
    const emailMatch=toHeader.value.match(/[\w.-]+@[\w.-]+\.\w+/);
    return emailMatch?{email:emailMatch[0],source:'gmail'}:null;
  }catch(e){return null;}
}

function buildBody(song,target,contactName){
  const sender=document.getElementById('sender-name').value;
  const firstName=contactName?contactName.split(' ')[0]:'guys';
  const vibe=song.vibe;
  const descLine=vibe?`${vibe} — thought it could be a great fit for ${target}.`:`Just heard something I think could really work for ${target}.`;
  return`Hi ${firstName},\n\nHope all is well! ${descLine}\n\n${song.title}: ${song.disco||'[demo link]'} (${song.writers||''})\n\nExcited to hear your thoughts!\n\nBest,\n${sender}`;
}

async function openDraft(mi,si,target){
  const song=meetings[mi].songs[si];
  const statusEl=document.getElementById(`add-status-${mi}`)||{innerHTML:''};
  document.getElementById('modal-alerts').innerHTML=`<div class="loading"><div class="spinner"></div><span>Looking up ${target}…</span></div>`;
  document.getElementById('modal-contact-choice').style.display='none';
  document.getElementById('modal-email-row').style.display='none';
  document.getElementById('draft-modal').style.display='flex';
  document.getElementById('modal-to').textContent=target;
  document.getElementById('modal-subject').value=`${song.title} - ${target}`;
  document.getElementById('modal-body').value='';
  document.getElementById('modal-status').innerHTML='';

  let info=await lookupArtist(target);
  if(!info)info=await lookupCompany(target);
  let contacts=[];
  let selectedContact=null;
  let email=null;
  let source='';

  if(info){
    contacts=info.contacts||[];
    if(contacts.length===1){selectedContact=contacts[0];email=contacts[0].email;source='airtable';}
    else if(contacts.length>1){
      source='airtable-multi';
      selectedContact=contacts[0];email=contacts[0]?.email||null;
    } else if(info.email){email=info.email;source='airtable';}
  }

  if(!email&&gmailToken){
    const gh=await checkGmailHistory(target);
    if(gh){email=gh.email;source='gmail';}
  }

  currentDraft={mi,si,target,info,contacts,selectedContact,email,source};

  document.getElementById('modal-alerts').innerHTML='';
  if(source==='airtable-multi'&&contacts.length>1){
    const choiceDiv=document.getElementById('modal-contact-choice');
    choiceDiv.style.display='block';
    choiceDiv.innerHTML=`<div style="font-size:12px;color:var(--text2);margin-bottom:6px">Multiple contacts found — choose one:</div>`
      +contacts.map((c,ci)=>`<div class="contact-choice${ci===0?' selected':''}" id="choice-${ci}" onclick="selectModalContact(${ci})">`
        +`<span><strong>${c.name}</strong>${c.tags?` · ${c.tags}`:''}</span>`
        +`<span style="font-size:12px;color:var(--text3)">${c.email||'no email'}</span></div>`).join('');
  }
  if(!email){
    document.getElementById('modal-email-row').style.display='block';
    document.getElementById('modal-alerts').innerHTML+=`<div class="alert alert-amber">Contact email not found${!gmailToken?' — connect Gmail to also check email history':' in Airtable or Gmail history'}. Enter manually below.</div>`;
  } else if(source==='gmail'){
    document.getElementById('modal-alerts').innerHTML+=`<div class="alert" style="background:var(--blue-bg);color:var(--blue);border:1px solid #bfdbfe;font-size:13px">Email found in Gmail history: ${email}</div>`;
  }

  const contactName=selectedContact?.name||info?.contactName||null;
  document.getElementById('modal-to').textContent=`${target}${contactName?' — '+contactName:''}${email?' <'+email+'>':''}`;
  document.getElementById('modal-body').value=buildBody(song,target,contactName);
}

function selectModalContact(ci){
  document.querySelectorAll('[id^="choice-"]').forEach((el,i)=>el.classList.toggle('selected',i===ci));
  currentDraft.selectedContact=currentDraft.contacts[ci];
  currentDraft.email=currentDraft.contacts[ci]?.email||null;
  const song=meetings[currentDraft.mi].songs[currentDraft.si];
  document.getElementById('modal-body').value=buildBody(song,currentDraft.target,currentDraft.selectedContact?.name);
  document.getElementById('modal-email-row').style.display=currentDraft.email?'none':'block';
}

function closeDraftModal(e){
  if(e&&e.target!==document.getElementById('draft-modal'))return;
  document.getElementById('draft-modal').style.display='none';
  currentDraft=null;
}

async function approveDraft(){
  if(!currentDraft)return;
  const statusEl=document.getElementById('modal-status');
  const manualEmail=document.getElementById('modal-manual-email').value.trim();
  const email=currentDraft.email||manualEmail||null;
  if(!email){alert('Enter the contact email to continue');return;}

  const subject=document.getElementById('modal-subject').value;
  const body=document.getElementById('modal-body').value;

  if(!gmailToken){
    statusEl.innerHTML=`<span style="color:var(--amber)">Connect Gmail first to save drafts</span>`;
    return;
  }

  statusEl.innerHTML=`<div class="loading"><div class="spinner"></div><span>Saving to Gmail…</span></div>`;
  try{
    const gmailSender=gmailUser?.email||'me';
    const raw=`From: ${gmailSender}\r\nTo: ${email}\r\nCc: music@hypervision.club\r\nSubject: ${subject}\r\nContent-Type: text/plain; charset=utf-8\r\n\r\n${body}`;
    const encoded=btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    const res=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/drafts',{
      method:'POST',
      headers:{Authorization:`Bearer ${gmailToken}`,'Content-Type':'application/json'},
      body:JSON.stringify({message:{raw:encoded}})
    });
    if(res.ok){
      const {mi,si,target}=currentDraft;
      const contactName=currentDraft.selectedContact?.name||currentDraft.info?.contactName||null;
      const existing=meetings[mi].songs[si].pitches.findIndex(p=>p.target===target);
      const pitchObj={target,contactName,email,approved:true,date:new Date().toLocaleDateString('en-GB'),sender:document.getElementById('sender-name').value};
      if(existing>=0)meetings[mi].songs[si].pitches[existing]=pitchObj;
      else meetings[mi].songs[si].pitches.push(pitchObj);
      saveMeetings();
      statusEl.innerHTML=`<span style="color:var(--green)">✓ Saved to Gmail drafts</span>`;
      setTimeout(()=>{
        document.getElementById('draft-modal').style.display='none';
        currentDraft=null;
        renderSongs(mi);
      },1200);
    } else {
      statusEl.innerHTML=`<span style="color:var(--red)">Error saving — try again</span>`;
    }
  }catch(e){statusEl.innerHTML=`<span style="color:var(--red)">Error: ${e.message}</span>`;}
}

document.getElementById('today-label').textContent=formatDate(todayISO());
loadConfig();
loadMeetings();
renderMeetings();
</script>
